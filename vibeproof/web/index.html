<!doctype html>
<!-- VibeProof Web 工作台的页面骨架：组织仓库任务、Agent 活动、结果标签页与源码证据检查器。 -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="基于源码证据的 Python 仓库接管工作台。" />
    <title>VibeProof · Repository Takeover</title>
    <link rel="icon" href="/static/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <aside class="sidebar">
        <div class="brand-row">
          <span class="brand-mark" aria-hidden="true">V</span>
          <span>VibeProof</span>
        </div>

        <button class="new-task-button" id="new-task" type="button">
          <span aria-hidden="true">＋</span>
          新建接管
        </button>

        <nav class="task-navigation" aria-label="Takeover runs">
          <p class="sidebar-label">最近任务</p>
          <div id="recent-runs" class="recent-runs">
            <p class="sidebar-empty">完成接管后会显示在这里。</p>
          </div>
        </nav>

        <div class="sidebar-footer">
          <div class="connection-dot" aria-hidden="true"></div>
          <div>
            <strong>本地工作区</strong>
            <span id="sidebar-provider">Mock · 确定性</span>
          </div>
        </div>
      </aside>

      <main class="workspace">
        <header class="topbar">
          <div class="breadcrumb">
            <span>仓库接管</span>
            <span class="breadcrumb-separator">/</span>
            <strong id="repository-title">新任务</strong>
          </div>
          <div class="run-state idle" id="run-state">
            <span class="state-dot" aria-hidden="true"></span>
            <span id="run-state-label">空闲</span>
          </div>
        </header>

        <section class="task-view" id="task-view">
          <div class="welcome" id="welcome-view">
            <div class="welcome-copy">
              <span class="eyebrow">基于源码证据的仓库接管</span>
              <h1>接管一个 Python 仓库。</h1>
              <p>
                建立架构地图，用源码验证每一条结论，生成学习路径，并规划可复现的运行验证。
              </p>
            </div>

            <form class="takeover-form" id="takeover-form">
              <div class="server-config loading" id="server-config">
                <span class="server-config-dot" aria-hidden="true"></span>
                <div>
                  <strong id="server-config-title">正在读取服务端配置</strong>
                  <small id="server-config-detail">模型密钥不会发送到浏览器。</small>
                </div>
              </div>

              <label for="repository-path">仓库路径</label>
              <div class="path-input-row">
                <span class="path-prefix">工作区 /</span>
                <input
                  id="repository-path"
                  name="repositoryPath"
                  type="text"
                  value="evals/fixtures/healthy_service"
                  autocomplete="off"
                  spellcheck="false"
                  required
                />
              </div>

              <div class="form-grid">
                <div class="field">
                  <label for="provider">模型服务</label>
                  <select id="provider" name="provider">
                    <option value="mock">Mock · 确定性</option>
                    <option value="openai-compatible">OpenAI compatible</option>
                    <option value="ollama">Ollama</option>
                  </select>
                </div>
                <div class="field">
                  <label for="model">指定模型</label>
                  <input id="model" name="model" type="text" placeholder="默认读取环境配置" />
                </div>
                <div class="field">
                  <label for="analysis-depth">分析深度</label>
                  <select id="analysis-depth" name="analysisDepth">
                    <option value="deep">深度接管 · 真实项目</option>
                    <option value="standard">标准接管 · 小型仓库</option>
                  </select>
                </div>
              </div>

              <label class="runtime-toggle">
                <input id="execute-runtime" name="executeRuntime" type="checkbox" />
                <span>
                  <strong>执行 pytest</strong>
                  <small>这会运行目标仓库代码；不勾选时只生成可审查的命令计划。</small>
                </span>
              </label>

              <div class="form-actions">
                <span class="form-hint">密钥只保存在服务端环境变量中。</span>
                <button class="primary-button" id="start-button" type="submit">
                  开始接管
                  <span aria-hidden="true">↗</span>
                </button>
              </div>
            </form>
          </div>

          <div class="run-view hidden" id="run-view">
            <div class="task-prompt" id="task-prompt"></div>
            <section class="activity-section" aria-labelledby="activity-title">
              <div class="section-heading">
                <h2 id="activity-title">Agent 活动</h2>
                <span id="activity-summary">运行中</span>
              </div>
              <div class="activity-feed" id="activity-feed" aria-live="polite"></div>
            </section>

            <section class="result-section hidden" id="result-section">
              <div class="result-tabs" role="tablist" aria-label="Takeover result">
                <button class="tab active" type="button" data-tab="overview">概览</button>
                <button class="tab" type="button" data-tab="evidence">证据</button>
                <button class="tab" type="button" data-tab="learning">学习路径</button>
                <button class="tab" type="button" data-tab="runtime">运行验证</button>
              </div>
              <div id="result-content"></div>
            </section>
          </div>
        </section>
      </main>

      <aside class="inspector" id="inspector">
        <header class="inspector-header">
          <div>
            <span class="eyebrow">源码证据</span>
            <h2 id="inspector-title">证据检查器</h2>
          </div>
          <button class="icon-button" id="close-inspector" type="button" aria-label="关闭证据检查器">×</button>
        </header>
        <div class="inspector-body" id="inspector-body">
          <div class="inspector-empty">
            <div class="file-glyph" aria-hidden="true">{ }</div>
            <p>选择一条已验证结论，查看对应的源码位置。</p>
          </div>
        </div>
      </aside>
    </div>

    <div class="toast hidden" id="toast" role="status"></div>
    <script src="/static/app.js" defer></script>
  </body>
</html>
