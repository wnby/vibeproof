[project]
name = "vibeproof"
version = "0.1.0"
description = "Evidence-backed onboarding and takeover agent for Python repositories."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "VibeProof contributors" }]
dependencies = [
    "fastapi>=0.116,<1",
    "pydantic>=2.11,<3",
    "uvicorn>=0.35,<1",
]

[dependency-groups]
dev = [
    "httpx2>=2.10,<3",
    "pytest>=8.4,<9",
    "ruff>=0.12,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vibeproof"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["vibeproof"]
